name: ShellCheck

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  shellcheck:
    timeout-minutes: 10
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."
          severity: warning
          # configs/ holds sourced dotfile fragments; bashrc and bin/kali are
          # linted explicitly below
          ignore_paths: configs

      - name: Lint the helper installed to ~/.local/bin
        run: shellcheck --severity=warning configs/bin/kali configs/bash/bashrc
