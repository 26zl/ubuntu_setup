# /etc/sysctl.d/99-hardening.conf — desktop-safe kernel hardening, the same
# Madaidan-aligned subset as the ThinkPad T14 NixOS config. Ubuntu 26.04 already
# ships dmesg_restrict=1, ptrace_scope=1, perf_event_paranoid=4, the fs.protected_*
# defaults, tcp_syncookies=1 and rp_filter=2; they are repeated so the file is
# the complete statement of the policy.

# hide kernel pointers even from root (perf/bpftrace symbol resolution needs 1)
kernel.kptr_restrict=2
# kernel log to root only
kernel.dmesg_restrict=1
# magic SysRq: keyboard-control functions (SAK, unraw) only
kernel.sysrq=4
# block runtime kernel replacement via kexec (undercuts Secure Boot); no kdump in use
kernel.kexec_load_disabled=1
# one-way: unprivileged BPF stays off until reboot (Ubuntu's 2 lets root re-enable it)
kernel.unprivileged_bpf_disabled=1
# harden the BPF JIT against spraying
net.core.bpf_jit_harden=2
# panic after 100 oopses instead of letting an exploit retry indefinitely
kernel.oops_limit=100
# max mmap ASLR entropy for 64-bit processes
vm.mmap_rnd_bits=32
# restrict ptrace to parent-child (gdb/strace on your own processes still work under sudo)
kernel.yama.ptrace_scope=1
# no core dumps from setuid binaries
fs.suid_dumpable=0
# TTY line disciplines are a recurring local-privesc surface; never autoload
dev.tty.ldisc_autoload=0

# symlink/hardlink/FIFO/regular-file protections in world-writable directories
fs.protected_symlinks=1
fs.protected_hardlinks=1
fs.protected_fifos=2
fs.protected_regular=2

# SYN-flood and TIME-WAIT assassination protection
net.ipv4.tcp_syncookies=1
net.ipv4.tcp_rfc1337=1
# anti-spoofing, loose mode: strict (1) drops Mullvad's policy-routed and
# container return traffic, which is asymmetric by design
net.ipv4.conf.all.rp_filter=2
net.ipv4.conf.default.rp_filter=2
# ICMP redirects and source routing: never legitimate on a workstation
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.secure_redirects=0
net.ipv4.conf.default.secure_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
net.ipv6.conf.all.accept_source_route=0
net.ipv6.conf.default.accept_source_route=0
# log packets with impossible source addresses
net.ipv4.conf.all.log_martians=1
net.ipv4.conf.default.log_martians=1
# prefer IPv6 privacy (temporary) addresses for outgoing connections
net.ipv6.conf.all.use_tempaddr=2
net.ipv6.conf.default.use_tempaddr=2
