# /etc/systemd/resolved.conf.d/hardening.conf
[Resolve]
# no DNS=/Domains=~. — a forced global resolver leaks past the VPN and bypasses
# the home network's own resolver; FallbackDNS applies only when no link DNS
# exists, so it never overrides the tunnel
FallbackDNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
# LLMNR and mDNS resolution are LAN name-spoofing vectors (Responder-style
# credential capture); redundant with DNS + Tailscale MagicDNS
LLMNR=no
MulticastDNS=no
