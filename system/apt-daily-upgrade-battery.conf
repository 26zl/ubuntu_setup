# /etc/systemd/system/apt-daily-upgrade.service.d/battery.conf — the stock unit
# has ConditionACPower=true. A laptop that sleeps through the 06:00 slot runs
# the timer at the next wake-up, usually on battery, so every run is skipped
# and security updates wait for a manual upgrade. Security updates are small:
# install them on battery too (unattended-upgrade's own check is turned off in
# apt-unattended-local.conf).
[Unit]
ConditionACPower=
