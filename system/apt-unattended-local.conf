// /etc/apt/apt.conf.d/52unattended-upgrades-local — security updates are
// already automatic (20auto-upgrades); also drop packages a security upgrade
// made unneeded so old kernels do not pile up in /boot.
Unattended-Upgrade::Remove-Unused-Dependencies "true";
// unattended-upgrade stops on battery by default ("System is on battery power,
// stopping"); together with system/apt-daily-upgrade-battery.conf this lets
// security updates install on battery. Metered connections are still skipped.
Unattended-Upgrade::OnlyOnACPower "false";
