# /etc/default/grub.d/99-hardening.cfg — kernel command line hardening (same set
# as the ThinkPad T14 NixOS config). Applied by update-grub; takes effect on reboot.
#   slab_nomerge          separate slab caches, contains heap overflows to one cache
#   init_on_alloc=1       zero memory on allocation (Ubuntu's build default, made explicit)
#   page_alloc.shuffle=1  randomise the page allocator free lists
#   vsyscall=none         remove the fixed-address legacy vsyscall page (ROP gadget);
#                         only pre-2013 static binaries need it
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT slab_nomerge init_on_alloc=1 page_alloc.shuffle=1 vsyscall=none"
