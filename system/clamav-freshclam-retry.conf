# /etc/systemd/system/clamav-freshclam-once.service.d/retry.conf — the daily run
# is often caught up right after a resume, before Wi-Fi is back. Without a retry
# a failed run waits a whole day and the signatures go stale. It retries every
# ten minutes, at most four times, then waits for the next daily run.
[Unit]
StartLimitIntervalSec=2h
StartLimitBurst=4

[Service]
Restart=on-failure
RestartSec=10min
