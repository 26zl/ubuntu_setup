# /etc/NetworkManager/conf.d/99-privacy.conf — Wi-Fi privacy. Ubuntu's main
# NetworkManager.conf sets scan-rand-mac-address=no; conf.d wins.
[device]
# random MAC while scanning for networks
wifi.scan-rand-mac-address=yes

[connection]
# stable per-network MAC when connected: the same address every time on one
# SSID (static DHCP leases keep working), a different one on every other network
wifi.cloned-mac-address=stable
# a random MAC is pointless if the DHCP request still carries the hostname
ipv4.dhcp-send-hostname=no
ipv6.dhcp-send-hostname=no
# IPv6 privacy extensions: temporary addresses preferred for outgoing traffic
ipv6.ip6-privacy=2
