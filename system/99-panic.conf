# /etc/sysctl.d/99-panic.conf — a frozen kernel reboots by itself and leaves a
# crash report. By default a CPU lockup only prints a warning: the laptop stays
# frozen until the power button is held, and nothing reaches EFI pstore. Here a
# hard or soft lockup becomes a panic, the panic log is written to EFI pstore
# (systemd-pstore moves it to /var/lib/systemd/pstore at the next boot) and the
# machine reboots 10 s later.
kernel.nmi_watchdog = 1
kernel.hardlockup_panic = 1
kernel.softlockup_panic = 1
kernel.panic = 10
