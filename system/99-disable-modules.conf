# /etc/modprobe.d/99-disable-modules.conf — protocols and buses this laptop never
# uses; `install … /bin/false` blocks loading outright (a blacklist only stops
# autoload). FireWire is DMA-capable.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install firewire-core /bin/false
install firewire-ohci /bin/false
