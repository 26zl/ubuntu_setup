# ubuntu-26.04-gnome-setup: dual boot with a BitLocker-protected Windows.
# Windows is started from the firmware boot menu (F12), never chainloaded from
# GRUB: chainloading changes the measured boot path and BitLocker asks for the
# recovery key. Without os-prober the GRUB menu lists Ubuntu only.
# Deployed by apply-system.sh only when a BitLocker volume is present.
GRUB_DISABLE_OS_PROBER=true
