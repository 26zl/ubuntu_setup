# ~/.config/mise/config.toml — global runtimes. Go, Rust (rustup) and Java come
# from apt/rustup because Ubuntu 26.04 ships them current; Node and uv from mise
# so a project can pin its own version with a local mise.toml / .node-version.
# pnpm/yarn: `corepack enable` (ships with Node).
[tools]
node = "lts"
uv = "latest"

[settings]
# no auto-install from the command-not-found handler; tools come from `mise install`
not_found_auto_install = false
